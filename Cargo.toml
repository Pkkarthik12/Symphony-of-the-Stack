[workspace]
resolver = "2"
members = ["crates/symphony-bridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Pkkarthik12/Symphony-of-the-Stack"
authors = ["Symphony of the Stack Contributors"]
description = "Sonify infrastructure metrics — your stack as music"

[workspace.dependencies]
anyhow = "1.0"
async-nats = "0.37"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
